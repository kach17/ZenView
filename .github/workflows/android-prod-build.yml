name: Android Production Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual triggers from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Prepare Keystore File
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ ! -z "$KEYSTORE_BASE64" ]; then
          echo "Decoding keystore..."
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
        else
          echo "No KEYSTORE_BASE64 secret found. Creating a placeholder keystore for unsigned build."
          keytool -genkey -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "placeholderPassword" -keypass "placeholderPassword" -dname "CN=placeholder, OU=placeholder, O=placeholder, L=placeholder, S=placeholder, C=US"
        fi

    - name: Build Production Artifacts
      env:
        KEYSTORE_PATH: "my-upload-key.jks"
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'placeholderPassword' }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'placeholderPassword' }}
      run: ./gradlew assembleRelease --stacktrace

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: production-apk
        path: app/build/outputs/apk/release/app-release.apk
